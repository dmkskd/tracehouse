services:
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana}:${GRAFANA_VERSION:-13.1.0}
    pull_policy: always
    ports:
      - "${GRAFANA_TEST_PORT:-3003}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DEFAULT_APP_MODE: development
      # Test instances must not count as running TraceHouse installs on
      # grafana.com. Two independent layers: these settings turn off usage
      # stats and the plugin version check, and grafana-com-proxy below blocks
      # the version check at the network level in case a Grafana version
      # ignores or renames a setting.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_GRAFANA_COM_API_URL: http://grafana-com-proxy/api
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: dmkskd-tracehouse-app
      GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-grafana-clickhouse-datasource}
    # Any call that bypasses grafana-com-proxy (or the stats.grafana.org usage
    # report) gets "connection refused" instead of reaching the internet.
    extra_hosts:
      - "grafana.com:127.0.0.1"
      - "stats.grafana.org:127.0.0.1"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ${GRAFANA_PLUGIN_TEST_DIST:-./plugin-dist}:/var/lib/grafana/plugins
    env_file:
      - path: ./.env
        required: false
    depends_on:
      clickhouse:
        condition: service_healthy
      grafana-com-proxy:
        condition: service_healthy

  # Answers Grafana's plugin version check locally and forwards plugin
  # downloads to grafana.com. See grafana-com-proxy.conf for the details.
  grafana-com-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./grafana-com-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/plugins/versioncheck"]
      interval: 2s
      timeout: 3s
      retries: 10

  clickhouse:
    image: "${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:latest}"
    pull_policy: always
    ports:
      - "${CLICKHOUSE_TEST_HTTP_PORT:-8124}:8123"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./clickhouse-cluster.xml:/etc/clickhouse-server/config.d/tracehouse-test-cluster.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
