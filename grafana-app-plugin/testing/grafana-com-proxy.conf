# Proxy between the test Grafana and the grafana.com API.
#
# Every running Grafana calls GET /api/plugins/versioncheck at startup and every
# 10 minutes, sending its Grafana version and the IDs of all installed plugins
# (including dmkskd-tracehouse-app). grafana.com counts these as running
# instances, so short-lived test stacks inflate the plugin's usage numbers.
#
# Plugin downloads use the same host and the same Grafana setting
# (GF_GRAFANA_COM_API_URL), so a DNS block on grafana.com would also break
# GF_INSTALL_PLUGINS. This proxy answers the version check locally and forwards
# everything else, so downloads keep working.
server {
  listen 80;

  # Running-instance signal: answer with "no updates" and never forward it.
  location = /api/plugins/versioncheck {
    default_type application/json;
    return 200 '[]';
  }

  # Plugin metadata and downloads (download redirects to storage.googleapis.com).
  location /api/ {
    proxy_pass https://grafana.com/api/;
    proxy_ssl_server_name on;
    proxy_set_header Host grafana.com;
  }
}
